<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Smith Family Board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,800&display=swap" rel="stylesheet">
<style>
/* VOICE: warm, glanceable, kitchen-wall friendly
   IDEA: the family fridge door — a big clock, the next three days, today's photo
   PICTURE: three day columns of colour-coded event cards beside a rotating family photo
   COLOUR and TYPE: warm paper ground, deep evergreen ink, each person their own colour; Fredoka + Nunito Sans
   LAYOUT: top bar (date · clock · weather), people row, calendar + photo, bottom tabs */
:root{color-scheme:light dark;
--bg:light-dark(#efe9df,#121519);--panel:light-dark(#fbf8f3,#1c2026);--panel2:light-dark(#f4efe7,#232830);
--ink:light-dark(#1f2a26,#eef1ee);--mute:light-dark(#6b726d,#9aa39f);--line:light-dark(#e2dbcf,#2d333b);
--accent:light-dark(#1f6f54,#5fd3a6);--warn:light-dark(#b4261a,#ff8a7a);--tick:light-dark(#173a2f,#0b0e11);--tickink:#b8f5c8}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 "Nunito Sans",system-ui,sans-serif;overflow-x:clip}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
h1,h2,h3,.clock,.dnum{font-family:Fredoka,system-ui,sans-serif;font-weight:600;margin:0}
.app{height:100vh;display:grid;grid-template-rows:auto auto minmax(0,1fr) auto;gap:clamp(8px,.9vw,14px);padding:clamp(8px,1vw,18px)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:22px;box-shadow:0 1px 0 rgba(0,0,0,.03),0 10px 30px -18px rgba(0,0,0,.35)}
/* top bar */
.top{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:10px clamp(14px,1.6vw,28px)}
.dow{font-size:clamp(12px,.9vw,15px);letter-spacing:.06em;color:var(--mute);font-weight:800}
.date{font-size:clamp(20px,1.8vw,32px);font-family:Fredoka;font-weight:600}
.clock{font-size:clamp(44px,4.6vw,86px);line-height:1;text-align:center;font-variant-numeric:tabular-nums}
.clock small{font-size:.32em;color:var(--mute);margin-left:.2em}
.wx{display:flex;justify-content:flex-end;align-items:center;gap:clamp(10px,1.2vw,22px)}
.wxs{display:grid;grid-template-columns:auto auto;gap:2px 14px;font-size:clamp(12px,.85vw,15px);color:var(--mute);white-space:nowrap}
.wxs b{color:var(--ink);font-weight:800}
.now{display:flex;align-items:center;gap:8px}
.now svg{width:clamp(36px,3vw,56px);height:auto}
.temp{font-family:Fredoka;font-weight:600;font-size:clamp(34px,3.2vw,60px);line-height:1}
.cond{font-size:13px;color:var(--mute);text-align:center}
/* people */
.people{display:flex;gap:clamp(6px,.6vw,12px);overflow-x:auto;padding-bottom:2px}
.pill{flex:1 1 0;min-width:110px;min-height:48px;border-radius:16px;font-family:Fredoka;font-weight:600;font-size:clamp(17px,1.4vw,26px);
 background:color-mix(in srgb,var(--c) 22%,var(--panel));color:color-mix(in srgb,var(--c) 70%,var(--ink));border:2px solid color-mix(in srgb,var(--c) 40%,transparent)}
.pill.on{background:var(--c);color:#fff;border-color:var(--c)}
.pill.dim{opacity:.45}
.pill.gear{flex:0 0 auto;min-width:56px;font-size:20px;--c:#7d8580}
/* main */
.main{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,.46fr);gap:clamp(8px,.9vw,14px);min-height:0}
.board{display:grid;grid-template-rows:auto minmax(0,1fr);min-height:0;overflow:hidden}
.bar{display:flex;gap:8px;align-items:center;padding:10px 12px;border-bottom:1px solid var(--line)}
.btn{min-height:44px;padding:0 16px;border-radius:12px;background:var(--panel2);border:1px solid var(--line);font-weight:800;font-size:15px;white-space:nowrap}
.btn.pri{background:var(--accent);color:light-dark(#fff,#0b1a14);border-color:transparent}
.ticker{flex:1;height:44px;border-radius:12px;background:var(--tick);overflow:hidden;position:relative;display:flex;align-items:center}
.ticker span{position:absolute;white-space:nowrap;font:600 clamp(18px,1.6vw,28px)/1 "Courier New",monospace;color:var(--tickink);letter-spacing:.08em;text-shadow:0 0 8px rgba(120,255,160,.5);animation:roll var(--dur,22s) linear infinite;left:100%}
@keyframes roll{to{transform:translateX(calc(-100% - 100vw))}}
.days{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));min-height:0;flex:1}
.day{border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.day:last-child{border-right:0}
.dh{display:flex;align-items:center;gap:10px;padding:12px 14px 8px}
.dnum{font-size:clamp(26px,2.2vw,40px);line-height:1}
.dname{font-weight:800;color:var(--mute);font-size:clamp(14px,1.1vw,19px)}
.today .dname{color:var(--accent)}
.today .dnum{color:var(--accent)}
.add{margin-left:auto;width:44px;height:44px;border-radius:12px;background:var(--panel2);border:1px solid var(--line);font-size:22px;font-weight:800}
.evs{overflow-y:auto;padding:4px 12px 14px;display:flex;flex-direction:column;gap:10px}
.ev{text-align:left;border-radius:16px;padding:10px 14px;color:#fff;background:var(--c);position:relative;box-shadow:0 8px 18px -12px var(--c);display:block;width:100%}
.ev.multi{background:linear-gradient(100deg,var(--c),var(--c2))}
.ev h3{font-size:clamp(16px,1.3vw,22px);line-height:1.15;font-weight:600}
.ev .t{font-size:clamp(12px,.9vw,15px);opacity:.92;font-weight:600;white-space:nowrap}
.ev .who{display:flex;gap:4px;margin-top:6px;flex-wrap:wrap}
.av{display:inline-grid;place-items:center;flex:none;width:var(--s,32px);height:var(--s,32px);border-radius:50%;overflow:hidden;background:var(--c);color:#fff;font:600 calc(var(--s,32px)*.45)/1 Fredoka,sans-serif;border:2px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.18)}
.av img{width:100%;height:100%;object-fit:cover;display:block}
.pill{display:flex;align-items:center;justify-content:center;gap:10px}.pill .av{--s:clamp(28px,2.2vw,40px)}
.faces{display:flex;flex-wrap:wrap;margin:0 0 6px}.faces .av{--s:clamp(30px,2.1vw,40px);margin-right:-8px}
.ev.has-faces{padding-top:10px}
.mrow .av{--s:44px;cursor:pointer;border-color:var(--line)}
.ev .who i{font-style:normal;font-size:12px;font-weight:800;background:rgba(255,255,255,.25);border-radius:99px;padding:2px 8px}
.ev.past{opacity:.45;filter:saturate(.3)}
.ev.past h3{text-decoration:line-through}
.badge{position:absolute;top:8px;right:8px;background:#fff;color:var(--warn);font-weight:800;font-size:12px;border-radius:9px;padding:3px 8px;white-space:nowrap}
.empty{color:var(--mute);font-size:15px;padding:18px 4px;text-align:center}
.sample{font-size:13px;color:var(--mute);padding:0 14px 10px}
/* photo */
.photo{position:relative;overflow:hidden;border-radius:22px;background:var(--panel2)}
.photo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity 1.4s}
.photo img.show{opacity:1}
.photo .ph{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:24px;color:var(--mute)}
.photo .ph svg{width:min(70%,260px);height:auto;margin:0 auto 12px;display:block}
.photo .pbtns{position:absolute;right:10px;bottom:10px;display:flex;gap:8px}
.photo .pbtns .btn{background:rgba(0,0,0,.45);color:#fff;border-color:transparent;backdrop-filter:blur(6px)}
/* other views */
.view{overflow-y:auto;padding:16px 18px}
.view h2{font-size:clamp(22px,1.8vw,32px);margin-bottom:12px}
.meals{display:grid;gap:8px}
.meal{display:grid;grid-template-columns:7.5em minmax(0,1fr);align-items:center;gap:10px}
.meal b{font-family:Fredoka;font-weight:600;font-size:18px}
.meal.td b{color:var(--accent)}
input[type=text],input[type=tel],input[type=date],input[type=time],select,textarea{min-height:44px;font-size:16px;border-radius:12px;border:1px solid var(--line);background:var(--panel2);padding:8px 12px;width:100%}
.chores{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.cg{border-radius:16px;padding:12px;background:color-mix(in srgb,var(--c) 12%,var(--panel));border:1px solid color-mix(in srgb,var(--c) 35%,transparent)}
.cg h3{color:color-mix(in srgb,var(--c) 75%,var(--ink));font-size:20px;margin-bottom:6px}
.ch{display:flex;align-items:center;gap:10px;min-height:44px;font-size:17px}
.ch input{width:24px;height:24px;accent-color:var(--c)}
.ch.done span{text-decoration:line-through;color:var(--mute)}
.ch .x{margin-left:auto;color:var(--mute);width:36px;height:36px}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.row>*{flex:1 1 160px}
/* nav */
.nav{display:grid;grid-template-columns:repeat(4,minmax(0,1fr)) auto;gap:clamp(8px,.9vw,14px)}
.tab{min-height:56px;border-radius:16px;background:var(--panel);border:1px solid var(--line);font-weight:800;font-size:clamp(15px,1.1vw,19px);display:flex;align-items:center;justify-content:center;gap:10px}
.tab svg{width:22px;height:22px}
.tab.on{background:var(--accent);color:light-dark(#fff,#0b1a14);border-color:transparent}
.fs{width:56px}
/* modal */
.scrim{position:fixed;inset:0;background:rgba(10,14,12,.55);display:none;place-items:center;padding:16px;z-index:10}
.scrim.open{display:grid}
.modal{width:min(560px,100%);max-height:92vh;overflow:auto;padding:20px}
.modal h2{font-size:24px;margin-bottom:14px}
.f{display:grid;gap:6px;margin-bottom:12px}
.f label,.lbl{font-weight:800;font-size:14px;color:var(--mute)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:44px;padding:0 14px;border-radius:99px;border:2px solid var(--c);color:color-mix(in srgb,var(--c) 75%,var(--ink));font-weight:800}
.chip.on{background:var(--c);color:#fff}
.mrow{display:grid;grid-template-columns:44px minmax(0,1fr) minmax(0,1fr) 56px 44px;align-items:center;gap:8px;margin-bottom:8px}
.jobs{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px;margin-bottom:22px}
.job{border-radius:18px;padding:14px 16px;background:color-mix(in srgb,var(--c,#7d8580) 16%,var(--panel));border:2px solid color-mix(in srgb,var(--c,#7d8580) 45%,transparent)}
.job h3{font-size:22px;margin-bottom:2px}.job p{margin:0 0 10px;color:var(--mute);font-size:14px}
.job .who{font-family:Fredoka;font-weight:600;font-size:26px;color:color-mix(in srgb,var(--c,#7d8580) 80%,var(--ink));margin-bottom:8px}
.sub{font-size:20px;margin:6px 0 10px}
.msg{max-width:760px}.msg textarea{min-height:110px;font-size:18px}
.rcp{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}.rcp .chip{display:inline-flex;align-items:center;gap:8px;padding-left:6px}.rcp .chip .av{--s:30px}
.rcp .chip.off{opacity:.4;cursor:not-allowed}.quick{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 16px}.quick .btn{font-weight:600}
.hint{color:var(--mute);font-size:14px;margin:8px 0 0}
.mrow input[type=color]{width:56px;height:44px;border:0;background:none;padding:0}
.acts{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
.btn.del{color:var(--warn);margin-right:auto}
.leaf{position:fixed;top:-40px;width:26px;pointer-events:none;animation:fall 16s linear forwards;z-index:5}
@keyframes fall{to{transform:translate(var(--dx),110vh) rotate(540deg)}}
@media (prefers-reduced-motion:reduce){.ticker span{animation:none;left:12px}.leaf{display:none}.photo img{transition:none}}
@media (max-width:820px){
 .app{height:auto;min-height:100vh}
 .top{grid-template-columns:1fr auto}.top .wx{grid-column:1/-1;justify-content:space-between}
 .main{grid-template-columns:1fr}.photo{min-height:340px;order:-1}
 .days{grid-template-columns:1fr}.day{border-right:0;border-bottom:1px solid var(--line)}
 .bar{flex-wrap:wrap}.ticker{flex-basis:100%;order:5}
 .nav{grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}.tab{flex-direction:column;gap:2px;font-size:13px;min-height:60px}.fs{display:none}
 .pill{flex:0 0 auto;min-width:0;padding:0 14px 0 6px;font-size:18px}.pill .av{--s:32px}
}
</style>
</head>
<body>
<div class="app">
 <header class="top card">
  <div><div class="dow" id="dow"></div><div class="date" id="date"></div></div>
  <div><div class="clock" id="clock"></div></div>
  <div class="wx" id="wx"><div class="wxs"><span>Weather</span><b>loading…</b></div></div>
 </header>
 <nav class="people" id="people" aria-label="Family members"></nav>
 <main class="main">
  <section class="board card" id="board"></section>
  <section class="photo card" id="photo"></section>
 </main>
 <nav class="nav">
  <button class="tab" data-v="cal"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Calendar</button>
  <button class="tab" data-v="meals"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M7 3v8M5 3v5a2 2 0 0 0 4 0V3M7 11v10M17 3c-2 2-3 5-3 8h3v10"/></svg>Meals</button>
  <button class="tab" data-v="chores"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="3" width="16" height="18" rx="3"/><path d="m8 10 2 2 4-4M8 16h8"/></svg>Chores</button>
  <button class="tab" data-v="msg"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 5h16v11H9l-5 4z"/></svg>Message</button>
  <button class="tab fs" id="fs" title="Full screen" aria-label="Full screen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
 </nav>
</div>
<div class="scrim" id="scrim"><div class="modal card" id="modal" role="dialog" aria-modal="true"></div></div>
<input type="file" id="pick" accept="image/*" multiple hidden>

<script>
{
const LAT=40.2969,LON=-111.6946; // Orem, UT
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const addD=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,9);
const mins=t=>{if(!t)return null;const[h,m]=t.split(':').map(Number);return h*60+m};
const fmtT=t=>{if(!t)return'';let[h,m]=t.split(':').map(Number);const ap=h>=12?'PM':'AM';h=h%12||12;return h+':'+pad(m)+' '+ap};
const DAYS=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const MONTHS=['January','February','March','April','May','June','July','August','September','October','November','December'];
const $=id=>document.getElementById(id);

function seed(){
 const t=new Date(),d0=ymd(t),d1=ymd(addD(t,1)),d2=ymd(addD(t,2));
 const J='jeremy',A='annie';
 return {ticker:'Happy Thanksgiving week from the Smiths!',
  members:[{id:J,name:'Jeremy',color:'#2f6fd6'},{id:A,name:'Annie',color:'#2f9a6c'},{id:'brooklyn',name:'Brooklyn',color:'#d6455d'},{id:'dutch',name:'Dutch',color:'#c9a227'},{id:'landyn',name:'Landyn',color:'#8a4fd8'},{id:'cooper',name:'Cooper',color:'#e0782b'},{id:'brighton',name:'Brighton',color:'#1f9bb5'},{id:'holland',name:'Holland',color:'#e05fa6'}],
  calMap:{'Fire Shifts':[J],"Annie's Calendar":[A],'Kids Calendar':['dutch','cooper']},
  events:[],
  meals:{Thursday:'Thanksgiving!'},
  chores:[]};
}
let S;try{S=JSON.parse(localStorage.getItem('smith-board'))}catch(e){}
if(!S||!S.members)S=seed();
const JOBS=[{id:'garbage',name:'Garbage',note:'Cans to the street Sunday by 8 PM',who:null},{id:'dishwasher',name:'Load dishwasher',note:'After dinner',who:null},{id:'sweeping',name:'Sweeping',note:'Kitchen and entry',who:null}];
if(!S.jobs)S.jobs=JSON.parse(JSON.stringify(JOBS));
/* monthly rotation: garbage -> sweeping -> dishwasher -> garbage */
const ROT=['garbage','sweeping','dishwasher'];
const mIdx=d=>d.getFullYear()*12+d.getMonth();
function rotFor(d){const r=S.rotation;if(!r||!r.assign)return null;const [y,m]=r.month.split('-').map(Number);const k=((mIdx(d)-(y*12+m-1))%3+3)%3;const out={};
 for(const [job,who] of Object.entries(r.assign)){const i=ROT.indexOf(job);if(i<0||!who)continue;out[ROT[(i+k)%3]]=who}return out}
function applyRot(){const a=rotFor(new Date());if(!a||!S.jobs)return;S.jobs.forEach(j=>{if(j.id in a)j.who=a[j.id]})}
if(!S.calMap)S.calMap={'Fire Shifts':['jeremy'],"Annie's Calendar":['annie'],'Kids Calendar':['dutch','cooper']};
const API='https://wtdxngoysurbjvryzaov.supabase.co/functions/v1/board';
let code='';try{code=localStorage.getItem('smith-code')||''}catch(e){}
let synced=[],lastSync=null,stateAt=null,saving=false,pending=false,dirty=false;
try{const c=JSON.parse(localStorage.getItem('smith-synced'));if(c){synced=c.events||[];lastSync=c.lastSync;stateAt=c.stateAt||null}}catch(e){}
async function pull(){
 if(!code)return askCode();
 try{const r=await fetch(API+'?key='+encodeURIComponent(code));
  if(r.status===401){code='';try{localStorage.removeItem('smith-code')}catch(e){}return askCode('That code didn’t work. Try again.')}
  if(!r.ok)throw 0;const j=await r.json();
  synced=Array.isArray(j.events)?j.events:[];lastSync=j.lastSync;smsServer=!!j.sms;
  if(j.state&&j.state.members&&!saving&&!dirty&&j.stateAt!==stateAt){S=j.state;stateAt=j.stateAt;try{localStorage.setItem('smith-board',JSON.stringify(S))}catch(e){}}
  else if((!j.state||dirty)&&!saving)save(true);
  try{localStorage.setItem('smith-synced',JSON.stringify({events:synced,lastSync,stateAt}))}catch(e){}
  if(!document.getElementById('scrim').classList.contains('open'))render();
 }catch(e){}
}
function askCode(msg){
 open('<h2>Connect this screen</h2><form id="cfm"><div class="f"><label for="cc">Household code</label><input type="text" id="cc" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="smith-…"></div>'+(msg?'<p style="color:var(--warn)">'+esc(msg)+'</p>':'')+'<p style="color:var(--mute)">Enter it once on each TV or phone. It links this screen to your family’s calendars and lists.</p><div class="acts"><button class="btn pri">Connect</button></div></form>');
 document.getElementById('cfm').onsubmit=e=>{e.preventDefault();code=document.getElementById('cc').value.trim().toLowerCase();try{localStorage.setItem('smith-code',code)}catch(x){}close();pull()};
}
const hm=d=>pad(d.getHours())+':'+pad(d.getMinutes());
function syncedFor(k){const out=[];synced.forEach((e,i)=>{const st=new Date(e.starts_at),en=e.ends_at?new Date(e.ends_at):null;let title=String(e.title||'');
 if(e.calendar==='Fire Shifts')title=/night/i.test(title)?'On shift (night)':'On shift (day)';
 const named=S.members.filter(m=>new RegExp('\\b'+m.name.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'\\b','i').test(title)).map(m=>m.id);
 const def=[].concat(S.calMap[e.calendar]||[]).filter(w=>S.members.some(m=>m.id===w));
 const job=(S.jobs||[]).find(j=>j.who&&j.name.toLowerCase()===title.trim().toLowerCase());
 const okey=e.calendar+'|'+e.title+'|'+e.starts_at,skey=e.calendar+'|'+e.title,at=S.attend||{};
 const valid=a=>Array.isArray(a)?a.filter(w=>S.members.some(m=>m.id===w)):null;
 const ov=valid((at.occ||{})[okey])||valid((at.series||{})[skey]);
 const who=ov?ov:job?[job.who]:named.length?named:def;

 if(e.all_day){let d=new Date(st.getFullYear(),st.getMonth(),st.getDate());const last=en?new Date(en.getTime()-1):d;for(let n=0;n<14&&ymd(d)<=ymd(last);n++,d=addD(d,1))if(ymd(d)===k)out.push({...base,date:k,start:'',end:''})}

function cal(){

 h+='<div class="days">';
 for(let i=0;i<3;i++){
  const d=addD(start,i),k=ymd(d);
  let evs=S.events.filter(e=>e.date===k).concat(syncedFor(k)).filter(e=>!filter||e.who.includes(filter));

  h+='<div class="day'+(k===today?' today':'')+'"><div class="dh"><span class="dnum">'+d.getDate()+'</span><span class="dname">'+DAYS[d.getDay()]+'</span><button class="add" data-add="'+k+'" aria-label="Add event">+</button></div><div class="evs">';

  for(const e of evs){
   const ms=e.who.map(mem).filter(Boolean),c=ms[0]?.color||'#6b726d',c2=ms[ms.length-1]?.color||c;
   const s=mins(e.start),en=mins(e.end);
   let cls='ev'+(ms.length>1?' multi':''),badge='';
   if(k<today||(k===today&&!e.overnight&&en!=null&&en<=nowM))cls+=' past';
   else if(k===today&&!e.overnight&&s!=null&&s<=nowM&&en!=null&&en>nowM){const l=en-nowM;badge='<span class="badge">Ends in '+(l>=60?Math.floor(l/60)+'h '+(l%60)+'m':l+' min')+'</span>'}
   else if(k===today&&s!=null&&s>nowM&&s-nowM<=60)badge='<span class="badge">Starts in '+(s-nowM)+' min</span>';
   const t=e.start?fmtT(e.start)+(e.end?' – '+fmtT(e.end)+(e.overnight?' next day':''):''):'All day';
   h+='<button class="'+cls+(ms.length?' has-faces':'')+'" style="--c:'+esc(c)+';--c2:'+esc(c2)+'" data-ev="'+esc(e.id)+'" data-k="'+k+'" aria-label="'+esc(e.title+(ms.length?', with '+ms.map(m=>m.name).join(', '):''))+'">'+badge+(ms.length?'<div class="faces">'+ms.map(av).join('')+'</div>':'')+'<h3>'+esc(e.title)+'</h3><div class="t">'+t+'</div></button>';
  }

 }

  const z=Math.min(img.width,img.height),c=document.createElement('canvas');c.width=c.height=160;c.getContext('2d').drawImage(img,(img.width-z)/2,(img.height-z)/2.6,z,z,0,0,160,160);ms[phI].photo=c.toDataURL('image/jpeg',.8);draw()};
 $('madd').onclick=()=>{ms.push({id:uid(),name:'',color:pal[ms.length%pal.length]});draw();const ins=$('ml').querySelectorAll('input[type=text]');ins[ins.length-1].focus()};
 $('mcan').onclick=close;
 $('msave').onclick=()=>{S.members=ms.filter(m=>m.name.trim()).map(m=>({...m,name:m.name.trim()}));const ids=S.members.map(m=>m.id);
  S.events.forEach(e=>e.who=e.who.filter(w=>ids.includes(w)));S.chores=S.chores.filter(c=>ids.includes(c.who));(S.jobs||[]).forEach(j=>{if(!ids.includes(j.who))j.who=null});if(filter&&!ids.includes(filter))filter=null;save();close();render()};
}

/* events */
document.addEventListener('click',e=>{
 const t=e.target.closest('button');if(!t)return;
 if(t.dataset.m){filter=filter===t.dataset.m?null:t.dataset.m;render();return}
 if(t.id==='gear')return membersForm();
 if(t.dataset.v){view=t.dataset.v;render();return}
 if(t.id==='prev'){start=addD(start,-1);render()}
 if(t.id==='next'){start=addD(start,1);render()}
 if(t.id==='tod'){start=new Date();render()}
 if(t.id==='edtk')tickerForm();
 if(t.dataset.add)evForm(null,t.dataset.add);
 if(t.dataset.ev){if(t.dataset.ev[0]==='s'){const e=syncedFor(t.dataset.k).find(x=>x.id===t.dataset.ev);if(e)attendForm(e)}else evForm(S.events.find(x=>x.id===t.dataset.ev))}
 if(t.dataset.rm){S.chores=S.chores.filter(c=>c.id!==t.dataset.rm);save();render()}
 if(t.id==='creset'){S.chores.forEach(c=>c.done=false);save();render()}
});
$('board').addEventListener('change',e=>{
 const t=e.target;
 if(t.dataset.meal){S.meals[t.dataset.meal]=t.value;save()}
 if(t.dataset.job!==undefined&&t.dataset.job){const j=S.jobs.find(x=>x.id===t.dataset.job);if(j){applyRot();j.who=t.value||null;const n=new Date();S.rotation={month:n.getFullYear()+'-'+pad(n.getMonth()+1),assign:Object.fromEntries(S.jobs.filter(x=>ROT.includes(x.id)).map(x=>[x.id,x.who]))};save();render()}}
 if(t.dataset.ck){const c=S.chores.find(x=>x.id===t.dataset.ck);if(c){c.done=t.checked;save();render()}}
});
$('board').addEventListener('submit',e=>{if(e.target.id!=='cf')return;e.preventDefault();
 S.chores.push({id:uid(),text:$('ct').value.trim(),who:$('cw').value,done:false});save();render()});
$('fs').onclick=()=>{try{document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen().catch(()=>{})}catch(e){}};

/* photos: kept on this device */
let photos=[],pi=0;
try{photos=JSON.parse(localStorage.getItem('smith-photos'))||[]}catch(e){}
const SCENE='<svg viewBox="0 0 200 140" aria-hidden="true"><rect x="10" y="10" width="180" height="120" rx="14" fill="currentColor" opacity=".12"/><circle cx="148" cy="42" r="14" fill="#f2a516" opacity=".8"/><path d="M10 118 70 60l40 40 22-20 58 50v6a14 14 0 0 1-14 14H24a14 14 0 0 1-14-14z" fill="#2f9a6c" opacity=".7"/><path d="M10 124 52 92l36 38H24a14 14 0 0 1-14-6z" fill="#1f6f54" opacity=".8"/></svg>';
function drawPhotos(){
 const p=$('photo');
 if(!photos.length){p.innerHTML='<div class="ph"><div>'+SCENE+'<b style="color:var(--ink);font-size:18px">Family photos</b><br>Add pictures from this device and they’ll rotate here.<br><br><button class="btn pri" id="padd">Add photos</button></div></div>';return}
 p.innerHTML=photos.map((s,i)=>'<img alt="" src="'+(s.startsWith('data:image/')?s:'')+'"'+(i===pi?' class="show"':'')+'>').join('')+'<div class="pbtns"><button class="btn" id="padd">Add</button><button class="btn" id="pclr">Clear</button></div>';
}
function nextPhoto(){if(photos.length<2)return;const im=$('photo').querySelectorAll('img');im[pi]?.classList.remove('show');pi=(pi+1)%photos.length;im[pi]?.classList.add('show')}
$('photo').addEventListener('click',e=>{if(e.target.id==='padd')$('pick').click();if(e.target.id==='pclr'){photos=[];pi=0;try{localStorage.removeItem('smith-photos')}catch(x){}drawPhotos()}});
$('pick').onchange=async e=>{
 for(const f of e.target.files){
  const url=URL.createObjectURL(f),img=new Image();
  await new Promise(r=>{img.onload=r;img.onerror=r;img.src=url});
  if(!img.width)continue;
  const sc=Math.min(1,1400/Math.max(img.width,img.height)),c=document.createElement('canvas');
  c.width=Math.round(img.width*sc);c.height=Math.round(img.height*sc);c.getContext('2d').drawImage(img,0,0,c.width,c.height);
  photos.push(c.toDataURL('image/jpeg',.72));URL.revokeObjectURL(url);
 }
 while(photos.length){try{localStorage.setItem('smith-photos',JSON.stringify(photos));break}catch(x){photos.shift()}}
 e.target.value='';drawPhotos();
};

/* a few falling leaves in autumn */
function leaf(){
 const m=new Date().getMonth();if(m<8||m>10)return;
 if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;
 const l=document.createElement('div');l.className='leaf';l.style.left=Math.random()*90+'vw';l.style.setProperty('--dx',(Math.random()*200-100)+'px');
 l.innerHTML='<svg viewBox="0 0 24 24"><path d="M12 2c3 4 8 5 9 10-3 0-5 2-6 5l-3-3-3 3c-1-3-3-5-6-5 1-5 6-6 9-10zm0 10v10" fill="#d9822b" stroke="#9c4f14" stroke-width="1"/></svg>';
 document.body.appendChild(l);setTimeout(()=>l.remove(),16500);
}

tick();render();drawPhotos();weather();pull();setInterval(pull,60000);
setInterval(tick,1000);
setInterval(()=>{if(view==='cal'&&!scrim.classList.contains('open'))render()},60000);
setInterval(weather,15*60000);
setInterval(nextPhoto,12000);
setInterval(leaf,25000);setTimeout(leaf,3000);
setInterval(()=>{const n=new Date();if(n.getHours()===0&&n.getMinutes()===0){start=new Date();render()}},60000);
}
